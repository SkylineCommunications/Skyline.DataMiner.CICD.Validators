# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # AutoMapper can't be updated as we would lose support for .NET Standard 2.0
      - dependency-name: "AutoMapper"
      
      # FluentAssertions equal to or higher than 8.0.0 has a different license, which requires payment
      - dependency-name: "FluentAssertions"
        versions: [ ">=8.0.0" ]
      # NPOI equal to or higher than 2.8.0 has a different license, which requires payment
      - dependency-name: "NPOI"
        versions: [ ">=2.8.0" ]
    exclude-paths:
      - "ProtocolTests/Protocol/**/*.csproj"
      - "Protocol.FeatureTests/Test Files/**"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"